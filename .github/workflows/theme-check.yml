name: Theme Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: theme-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Shopify CLI
        run: npm ci

      - name: Validate Liquid and theme files
        run: npm run verify
