name: Theme Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: theme-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out theme
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Shopify CLI
        run: npm ci

      - name: Validate Liquid and theme files
        run: npm run verify

  publish-production:
    name: Publish production theme
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: theme-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://shop.maliev.com/
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
    steps:
      - name: Check out verified theme
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Shopify CLI
        run: npm ci

      - name: Require Theme Access credential
        shell: bash
        run: test -n "$SHOPIFY_CLI_THEME_TOKEN"

      - name: Publish to the existing live theme
        run: >-
          npx shopify theme push
          --store 10b918-e4.myshopify.com
          --theme 190305730839
          --allow-live
          --strict
          --ignore config/settings_data.json
